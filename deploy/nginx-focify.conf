# nginx server block for focify.me on the VPS.
#
#   /        the static gallery built from site/ (rsync site/dist here)
#   /demo/   the demo runner (Express on 127.0.0.1:8090)
#   /api/    the runner's API and SSE stream
#
# Cloudflare terminates TLS and proxies to port 80. Install as
# /etc/nginx/sites-enabled/focify.conf, remove any older focify.me block from
# apps.conf (nginx loads that file first and the first match wins), then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# nginx runs as www-data and must be able to reach the static root inside the
# tippyflits home directory. Once per box:
#   chmod o+x /home/tippyflits
#   chmod -R o+rX /home/tippyflits/focify-me/site/dist
# Without this, try_files reports every page as 404 and error.log shows
# "stat() ... failed (13: Permission denied)".

server {
    listen 80;
    server_name focify.me www.focify.me;

    root /home/tippyflits/focify-me/site/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /demo/ {
        proxy_pass http://127.0.0.1:8090/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering, long-lived connections, large uploads
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 512m;
    }
}
