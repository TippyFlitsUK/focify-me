# nginx server block for focify.me on the VPS.
#
#   /                      the converter (Express on 127.0.0.1:8090), as always
#   /demos/ /guides/ /about/ /explore/ /archive/ /agents/ /timemachine/ /llms.txt   the gallery pages, static files from site/dist
#   /api/                  the converter's API and SSE stream
#
# Cloudflare terminates TLS and proxies to port 80. Install as
# /etc/nginx/sites-enabled/focify.conf (no other focify.me block may remain in
# apps.conf: nginx loads that file first and the first match wins), then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# nginx runs as www-data and must be able to reach the static root inside the
# tippyflits home directory. Once per box:
#   chmod o+x /home/tippyflits
#   chmod -R o+rX /home/tippyflits/focify-me/site/dist
# Without this the gallery pages are 404 and error.log shows
# "stat() ... failed (13: Permission denied)".

server {
    listen 80;
    server_name focify.me www.focify.me;

    root /home/tippyflits/focify-me/site/dist;
    index index.html;

    absolute_redirect off;

    # Gallery sections, built by `npm --prefix site run build`.
    location ~ ^/(demos|guides|about|explore|archive|agents|timemachine)(/.*)?$ {
        try_files $uri $uri/ =404;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # Converter API and SSE stream.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 512m;
    }

    # Everything else is the converter page and its assets.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
